name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  publish-images:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read secrets
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry |  STAGE_REGISTRY_REGISTRY;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username |  STAGE_REGISTRY_USERNAME;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password |  STAGE_REGISTRY_PASSWORD;
      - name: Publish images to staging
        uses: rancher/ecm-distro-tools/actions/publish-image@b8127344173a5750da03068316ee40c547652c15 # v0.78.3
        with:
          image: ali-operator
          tag: ${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push-to-public: false
          prime-repo: rancher
          identity-registry: ${{ env.PRIME_REGISTRY }}
          prime-registry: ${{ env.STAGE_REGISTRY_REGISTRY }}
          prime-username: ${{ env.STAGE_REGISTRY_USERNAME }}
          prime-password: ${{ env.STAGE_REGISTRY_PASSWORD }}
          prime-make-target: push-prime-image
      - name: Publish images to Prime
        if: ${{ !contains(github.ref_name, '-rc') }} # never push pre-release images to prime
        uses: rancher/ecm-distro-tools/actions/publish-image@b8127344173a5750da03068316ee40c547652c15 # v0.78.3
        with:
          image: ali-operator
          tag: ${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push-to-public: false
          prime-repo: rancher
          prime-registry: ${{ env.PRIME_REGISTRY }}
          prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
          prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}
          prime-make-target: push-prime-image
      - name: Cleanup checksum files # in order to avoid goreleaser dirty state error, remove once rancher/ecm-distro-tools/actions/publish-image@main gets updated
        run: rm -f slsactl_*_checksums.txt*

  release:
    permissions:
      contents: write # required for creating GH release
    runs-on: ubuntu-latest
    needs: publish-images
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name}}
      - name: Setup goreleaser
        shell: bash
        run: |-
          OS="Linux"
          if [[ ${RUNNER_OS} != "Linux" ]]; then
          	echo "Unsupported OS: ${RUNNER_OS}"
          	exit 1
          fi

          # renovate-local: goreleaser-x86_64
          GORELEASER_VERSION="v2.19.0"
          # renovate-local: goreleaser-x86_64=v2.19.0
          GORELEASER_CHECKSUM_x86_64="ebc3194ad1d1b1787614405285a0039665cd4c5bd3305215a1b201600f90630b"

          ARCH=$(uname -m)
          CHECKSUM="${GORELEASER_CHECKSUM_x86_64}"
          if [[ "${ARCH}" != "x86_64" ]]; then
          	echo "Unsupported architecture: ${ARCH}"
          	exit 1
          fi

          FILE="goreleaser_${OS}_${ARCH}.tar.gz"

          echo "Installing ${FILE}"
          curl -LO "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/${FILE}"
          echo "${CHECKSUM} ${FILE}" | sha256sum -c
          tar -xf "${FILE}" goreleaser

          if sudo -n true &> /dev/null; then
          	sudo install -m 755 goreleaser /usr/local/bin/goreleaser
          else
          	install -m 755 goreleaser /usr/local/bin/goreleaser
          fi
          rm -f "${FILE}" goreleaser
      - name: Create release (DRAFT)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required for creating GH release
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }} # specify the tag to be released
        id: goreleaser
        shell: bash
        run: |-
          goreleaser release --clean --verbose --draft
          if [[ ! -f dist/metadata.json ]] || [[ ! -s dist/metadata.json ]]; then
            echo "Missing required file: dist/metadata.json"
            exit 1
          fi
          if [[ ! -f dist/artifacts.json ]] || [[ ! -s dist/artifacts.json ]]; then
            echo "Missing required file: dist/artifacts.json"
            exit 1
          fi
          echo "metadata=$(tr -d '\n\r' < dist/metadata.json)" >> "${GITHUB_OUTPUT}"
          echo "artifacts=$(tr -d '\n\r' < dist/artifacts.json)" >> "${GITHUB_OUTPUT}"
      - name: Upload charts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required for updating GH release
          REPO: rancher # First name component for Docker repository to reference in `values.yaml` of the Helm chart release, this is expected to be `rancher`, image name is appended to this value
          TAG: ${{ github.ref_name }} # image tag to be referenced in `values.yaml` of the Helm chart release
        run: |
          version=$(echo '${{ steps.goreleaser.outputs.metadata }}' | jq -r '.version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "::error::Failed to extract version from goreleaser metadata"
              exit 1
          fi

          echo "Publishing helm charts (version: $version)"

          # Both version and appVersion are set to the same value in the Chart.yaml (excluding the 'v' prefix)
          CHART_VERSION=$version GIT_TAG=$version make charts

          # Check if files exist before processing
          if [ ! -d "bin/" ] || [ -z "$(find bin/ -name '*.tgz')" ]; then
            echo "No chart files found in bin/ directory"
            exit 1
          fi
      - name: Add charts to branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(echo '${{ steps.goreleaser.outputs.metadata }}' | jq -r '.version')
          branch_version=v$(echo "$version" | cut -d'.' -f1,2)
          charts_branch=charts/$branch_version
          if [ ! -e ~/.gitconfig ]; then
            git config --global user.name "ali-operator-bot"
            git config --global user.email ali-operator@suse.de
          fi
          echo "Publishing helm chart in the branch $charts_branch"
          if ! git ls-remote --exit-code --heads origin "$charts_branch"; then
            git checkout --orphan "$charts_branch"
            git rm -rf .
            echo "# Ali Operator Helm Charts for $branch_version versions" > README.md
            echo "The documentation is centralized in a unique place, checkout https://github.com/rancher/ali-operator." >> README.md
            git checkout origin/main -- LICENSE .gitignore
            git add README.md LICENSE .gitignore
            git commit -m "Initial commit for $charts_branch"
          else
            git checkout .
            git checkout "$charts_branch"
          fi
          mkdir -p charts
          for f in $(find bin/ -name '*.tgz'); do
            tar -xf $f -C charts/
          done
          git add charts/**/*
          git commit -m "Update charts to version $version"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin "$charts_branch"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
